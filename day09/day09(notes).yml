                    INDUSTRY REALITY CHECK
================================================================================

  📌 JSON  → Lightweight, API testing, microservices
  📌 CSV   → Business data, Excel exports, non-technical team members
  📌 ENV   → CI/CD pipelines, multi-environment testing, security


================================================================================
                    QUICK REVISION
================================================================================

┌─────────────────────────────────────────────────────────────────────────────┐
│ Concept                    │ Key Point                                      │
├────────────────────────────┼────────────────────────────────────────────────┤
│ JSON                       │ Native to Node.js → No extra package          │
│ CSV                        │ Needs fs + csv-parse → Extra package         │
│ Environment                │ Uses process.env → CI/CD ready                │
│ Parameterization Benefit   │ Same logic, different data                    │
│ Data-Driven Testing        │ Run one test with multiple datasets           │
└────────────────────────────────────────────────────────────────────────────┘

GOLDEN RULES:
================================================================================

  1. JSON → Language understands it natively
  2. CSV → Needs fs (to read) + parser (to convert text → objects)
  3. Environment → Never hardcode URLs or credentials
  4. Always store secrets in .env files (add to .gitignore)


