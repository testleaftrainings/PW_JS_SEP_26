================================================================================
PART 6: test.step()
================================================================================

Groups actions inside a test.

SYNTAX:
await test.step('Login', async () => { });

WHY USE IT?
--------------------------------------------------------------------------------
Improves HTML reports.

Without step:
  Create Lead

With step:
  Create Lead
      Login
      Open CRM
      Create Lead
      Verify Success

NESTED STEPS (Allowed):
await test.step('Create Lead', async () => {
    await test.step('Fill Details', async () => { });
});

RETURNING VALUES:
const id = await test.step('Get Lead Id', async () => {
    return '1001';
});

BOX OPTION:
await test.step(
    'Login',
    async () => { },
    { box: true }
);

Useful in Page Object Models to report failures at the business-step level.

INTERVIEW QUESTIONS:
• Where do you use test.step() in projects?
• Can test.step() be nested?
• What is box: true?


================================================================================
PART 7: HOOKS
================================================================================

Playwright provides four hooks.

┌─────────────────────────────────────────────────────────────────────────────┐
│ Hook           │ Executes                                                   │
├────────────────┼────────────────────────────────────────────────────────────┤
│ beforeAll()    │ Once before all tests                                      │
│ beforeEach()   │ Before every test                                          │
│ afterEach()    │ After every test                                           │
│ afterAll()     │ Once after all tests                                       │
└────────────────┴────────────────────────────────────────────────────────────┘
----------------
EXECUTION FLOW:
beforeAll()
    ↓
beforeEach()
    ↓
Test1
    ↓
afterEach()
    ↓
beforeEach()
    ↓
Test2
    ↓
afterEach()
    ↓
afterAll()
----------------


beforeAll():
--------------------------------------------------------------------------------
Runs once before all tests.

Used for:
  • Create shared data
  • API Authentication
  • Database setup
  • Generate token

beforeEach():
--------------------------------------------------------------------------------
Runs before every test.

Used for:
  • Login
  • Launch application
  • Navigate to Home Page

afterEach():
--------------------------------------------------------------------------------
Runs after every test.

Used for:
  • Logout
  • Screenshot on failure
  • Clean up test data
  • Close dialogs

afterAll():
--------------------------------------------------------------------------------
Runs once after all tests.

Used for:
  • Delete created data
  • Close database connections
  • Release shared resources

SCOPE:
--------------------------------------------------------------------------------
Hooks declared inside test.describe() apply only to that group.

MULTIPLE HOOKS:
--------------------------------------------------------------------------------
Hooks execute in the order they are declared.

test.beforeEach(Hook1);
test.beforeEach(Hook2);

Execution: Hook1 → Hook2 → Test

INTERVIEW QUESTIONS:
• Difference between beforeAll() and beforeEach()?
• Can hooks use fixtures?
• Can hooks be scoped to a group?
• What happens if multiple beforeEach() hooks are declared?


