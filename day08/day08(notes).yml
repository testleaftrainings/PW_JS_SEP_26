================================================================================
                            DATA STRUCTURES  
          (TypeScript + Real-Time Automation Framework Perspective)
================================================================================

1. WHAT IS A DATA STRUCTURE?
================================================================================

A Data Structure is a way of organizing and storing data so that it can be
accessed, managed, and modified efficiently.

REAL-TIME EXAMPLE:
--------------------------------------------------------------------------------
Instead of:
let username = "admin";
let password = "admin123";
let url = "https://qa-app.com";

Store related data together:
const config = {
    username: "admin",
    password: "admin123",
    url: "https://qa-app.com"
}

This improves maintainability and readability.


2. WHY DO WE NEED DATA STRUCTURES?
================================================================================

WITHOUT DATA STRUCTURES:
--------------------------------------------------------------------------------
let empId1 = 101;
let empId2 = 102;
let empId3 = 103;

Difficult to manage when data grows.

WITH DATA STRUCTURES:
--------------------------------------------------------------------------------
const empIds = [101, 102, 103];

Easy to: Add, Remove, Search, Sort, Iterate


3. ARRAY
================================================================================

Stores multiple values in a single variable.

const browsers = ["chrome", "edge", "firefox", "safari"];

REAL-TIME AUTOMATION EXAMPLE - Store supported browsers:
--------------------------------------------------------------------------------
const browsers = ["chrome", "edge", "firefox", "safari"];

Access: browsers[0]  // chrome

FRAMEWORK USAGE:
  • Test Data
  • URLs
  • Browser Names
  • User Roles
  • Expected Values


4. OBJECT
================================================================================

Stores data as key-value pairs.

const employee = {
    empId: 882,
    designation: "Sr.SDET"
}

REAL-TIME AUTOMATION EXAMPLE - Environment Configuration:
--------------------------------------------------------------------------------
const config = {
    username: "DemoCSR",
    password: "crmsfa",
    url: "https://leaftaps.com"
}

FRAMEWORK USAGE:
  • Config Files
  • Test Data
  • API Payloads
  • Environment Settings


5. NESTED OBJECT
================================================================================

Object inside another object.

const empInfo = {
    bhuvaneshInfo: {
        empId: 882,
        designation: "Sr.SDET"
    },
    vinothInfo: {
        empId: 445,
        designation: "SDET"
    }
}

STRUCTURE:
--------------------------------------------------------------------------------
empInfo
│
├── bhuvaneshInfo
│   ├── empId
│   └── designation
│
└── vinothInfo
    ├── empId
    └── designation

REAL-TIME AUTOMATION EXAMPLE - Multiple Environment Configurations:
--------------------------------------------------------------------------------
const environments = {
    qa: {
        url: "https://qa-app.com"
    },
    prod: {
        url: "https://prod-app.com"
    }
}

Access: environments.qa.url

================================================================================
                    DATA PARAMETERIZATION IN PLAYWRIGHT
                       (JSON + CSV + ENVIRONMENT)
================================================================================


INTRODUCTION
================================================================================

Parameterization is one of those ideas that sounds fancy but is actually very
human logic:

  "Run the same behavior with different inputs without rewriting the test."

Instead of writing ten tests that differ only by data, you write one test + many
data values. Automation stops being copy-paste and starts behaving like a
scientific experiment: same procedure, different variables.

SIMPLE REAL-WORLD ANALOGY:
--------------------------------------------------------------------------------
Imagine testing a login page.

Without Parameterization:
  Test login with user1
  Test login with user2
  Test login with user3

That's repetition disguised as productivity.

With Parameterization:
  One login test → run with multiple usernames/passwords

Same logic. Different data.

WHY PARAMETERIZATION MATTERS (Real Engineering Reason):
--------------------------------------------------------------------------------
WITHOUT IT:
  • Duplicated tests
  • Maintenance nightmare
  • Bug fixes repeated everywhere

WITH IT:
  • One logic source
  • Unlimited test coverage
  • Cleaner reporting

You change logic once → affects all datasets.

PARAMETERIZATION METHODS IN PLAYWRIGHT:
================================================================================
  Method 1 — Parameterization using JSON file
  Method 2 — Parameterization using CSV/Excel file
  Method 3 — Environment parameterization (Dev, QA, UAT, Prod)


================================================================================
                    METHOD 1: DATA PARAMETERIZATION WITH JSON
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Feeding test data from external JSON files instead of hardcoding values.
Useful for data-driven testing.

WHAT IS JSON?
--------------------------------------------------------------------------------
JSON = JavaScript Object Notation
A text format for structured data that humans & machines both love.

JSON BUILDING BLOCKS:
--------------------------------------------------------------------------------
  {}  → Objects  → { key: value }
  []  → Arrays   → [ value1, value2 ]
  ""  → Strings  → "name": "Bhuvi"
  num → Numbers  → 7
  bool→ Boolean  → true
  null→ null     → null

No functions. No logic. Just pure data. — That's the magic!

WHY JSON WON:
--------------------------------------------------------------------------------
┌────────────────────────────────────────────────────────────────────────────┐
│ Reason                    │ Why It Mattered                                │
├───────────────────────────┼────────────────────────────────────────────────┤
│ Perfect Timing            │ Web apps needed constant server chat           │
│ Native to JS              │ JSON.parse(data) — instant objects!            │
│ Human-readable            │ Debug by looking — no archaeology required     │
│ Language-agnostic         │ Java, Python, C#, Rust — everyone speaks JSON  │
│ API Perfect               │ REST APIs became JSON machines                 │
└───────────────────────────┴────────────────────────────────────────────────┘

WHERE YOU SEE JSON DAILY:
--------------------------------------------------------------------------------
  • Playwright Tests → API responses
  • Config Files → package.json, tsconfig.json
  • Auth → Storage state, tokens
  • Cloud → Microservices chat
  • Databases → NoSQL, exports

SAMPLE JSON STRUCTURE (testData.json):
--------------------------------------------------------------------------------
[
  {
    "TcaseId": "TC001",
    "Username": "democsr",
    "Password": "crmsfa"
  },
  {
    "TcaseId": "TC002",
    "Username": "democsr2",
    "Password": "crmsfa"
  }
]

STEP-BY-STEP PROCESS FOR JSON:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ STEP 1: Create JSON File                                                    │
│   → Create a .json file inside the Data folder                             │
│   → Define test data in JSON format                                        │
│   → Use array of objects for multiple test cases                           │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 2: Import JSON into Spec File                                          │
│   → Create a .spec.ts file                                                 │
│   → Import data using:                                                     │
│     import * as testData from "./Data/xxx.json";                           │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 3: Use in Test Cases                                                   │
│   → Loop through imported data                                             │
│   → Access values using keys                                               │
│   → Example: testData[0].Username                                          │
│   → Perform validations with test data                                     │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 4: Run the Test                                                        │
│   → Execute the spec file                                                  │
│   → Test runs multiple times with different data                           │
│   → Observe data-driven testing in action                                  │
└─────────────────────────────────────────────────────────────────────────────┘

QUICK CODE REFERENCE:
--------------------------------------------------------------------------------
import credentials from "./Data/loginData.json";

test.describe("Data Driven Login Test", () => {
  for (const data of credentials) {
    test(`Test ${data.TcaseId} with ${data.Username}`, async ({ page }) => {
      await page.fill('#username', data.Username);
      await page.fill('#password', data.Password);
      await page.click('#loginBtn');
    });
  }
});

BENEFITS OF JSON PARAMETERIZATION:
--------------------------------------------------------------------------------
  ✓ No hardcoded values in test scripts
  ✓ Easy to add/modify test data
  ✓ Separate data from test logic
  ✓ Reuse same test with multiple datasets
  ✓ Perfect for regression testing


================================================================================
                    METHOD 2: DATA PARAMETERIZATION WITH CSV
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
CSV = Comma Separated Values
A plain text format for tabular data, commonly used for business data and
Excel exports.

WHY CSV NEEDS INSTALLATION (Unlike JSON):
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ CSV file content:                                                          │
│ ┌──────────────────────┐                                                   │
│ │ username,password    │                                                   │
│ │ demo,123             │                                                   │
│ │ admin,456            │                                                   │
│ └──────────────────────┘                                                   │
│                                                                             │
│ ❌ Node.js does NOT automatically know:                                     │
│    • Where columns start/end                                               │
│    • Where rows begin                                                      │
│    • How to handle commas inside values                                    │
│    • How to handle quoted values                                           │
│    • Which row maps to headers                                             │
│                                                                             │
│ → CSV = Just plain text file                                               │
│ → PACKAGE NEEDED to parse correctly                                        │
└─────────────────────────────────────────────────────────────────────────────┘

INSTALLATION:
--------------------------------------------------------------------------------
npm install csv-parse

WHY TWO IMPORTS FOR CSV?
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ IMPORT 1: fs (File System)                                                  │
│   import fs from "fs";                                                     │
│   fs.readFileSync("./data/login.csv")                                      │
│   → Reads file from system → brings content into code                     │
│   → WITHOUT fs → File content never reaches your script                   │
├─────────────────────────────────────────────────────────────────────────────┤
│ IMPORT 2: parse (CSV Parser)                                               │
│   import { parse } from "csv-parse/sync";                                 │
│   → Converts RAW TEXT → USABLE OBJECTS:                                   │
│                                                                             │
│   INPUT (Raw CSV):           OUTPUT (Array of Objects):                    │
│   ┌─────────────────┐        ┌─────────────────────────┐                   │
│   │ username,pass   │   →    │ { username:"demo",       │                   │
│   │ demo,123        │        │   password:"123" }       │                   │
│   └─────────────────┘        └─────────────────────────┘                   │
└─────────────────────────────────────────────────────────────────────────────┘

STEP-BY-STEP PROCESS FOR CSV:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ STEP 1: Install csv-parse package                                           │
│   npm install csv-parse                                                    │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 2: Import Dependencies                                                 │
│   import { parse } from "csv-parse/sync";                                  │
│   import fs from "fs";                                                     │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 3: Read CSV File                                                       │
│   fs.readFileSync("Data/login.csv")                                        │
│   → Reads raw CSV content from Data folder                                 │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 4: Parse CSV Content                                                   │
│   parse(content, { columns: true, skip_empty_lines: true })                │
│   → First row = column names                                               │
│   → Ignore blank rows                                                      │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 5: Store in Variable                                                   │
│   Store parsed result in 'records' variable                                │
│   Each row becomes a JavaScript object                                     │
├─────────────────────────────────────────────────────────────────────────────┤
│ STEP 6: Use in Tests                                                        │
│   Loop through records array                                               │
│   Access values using column names                                         │
│   Example: records[0].username, records[0].password                        │
└─────────────────────────────────────────────────────────────────────────────┘

CSV → JSON CONVERSION EXAMPLE:
--------------------------------------------------------------------------------
INPUT CSV:
┌──────┬──────────────────┬──────────┐
│ tcid │ username         │ password │
├──────┼──────────────────┼──────────┤
│ 1    │ demoSalesmanager │ crmsfa   │
│ 2    │ demoCSR          │ crmsfa   │
└──────┴──────────────────┴──────────┘

OUTPUT JSON (RECORDS):
[
  { tcid: "1", username: "demoSalesmanager", password: "crmsfa" },
  { tcid: "2", username: "demoCSR", password: "crmsfa" }
]

QUICK CODE REFERENCE:
--------------------------------------------------------------------------------
import { parse } from "csv-parse/sync";
import fs from "fs";

let records = parse(
  fs.readFileSync("Data/login.csv"),
  { columns: true, skip_empty_lines: true }
);

// Access: records[0].username → "demoSalesmanager"
// Access: records[1].password → "crmsfa"

USING IN TESTS:
--------------------------------------------------------------------------------
import { test } from '@playwright/test';
import fs from 'fs';
import { parse } from 'csv-parse/sync';

const records = parse(
  fs.readFileSync('Data/login.csv'),
  { columns: true, skip_empty_lines: true }
);

for (const record of records) {
  test(`Login with ${record.username}`, async ({ page }) => {
    await page.goto('https://example.com/login');
    await page.fill('#username', record.username);
    await page.fill('#password', record.password);
    await page.click('#login');
  });
}

JSON vs CSV COMPARISON:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ FORMAT  │ NATIVE TO NODE?   │ WHAT'S NEEDED?        │ BEST FOR              │
├─────────┼───────────────────┼───────────────────────┼───────────────────────┤
│ JSON    │ ✅ YES            │ Just import directly  │ API testing, configs  │
│ CSV     │ ❌ NO             │ fs + parse package    │ Business data, Excel  │
└─────────┴───────────────────┴───────────────────────┴───────────────────────┘

================================================================================
		 STORAGE STATE (AUTHENTICATION PERSISTENCE)
================================================================================

WHAT IS A BROWSER CONTEXT?
--------------------------------------------------------------------------------
A BrowserContext is an isolated browser profile.

Think:
  Chrome Profile A → cookies + localStorage + sessionStorage
  Chrome Profile B → completely separate identity

In Playwright:
const context = await browser.newContext();

Each context has its own:
  • cookies
  • localStorage
  • sessionStorage
  • authentication tokens

Basically → its own "user".

WHAT storageState() ACTUALLY DOES:
--------------------------------------------------------------------------------
await context.storageState({ path: 'auth.json' });

This command says:
  "Take everything that proves this user is logged in and serialize it into a file."

It captures:
  ✓ Cookies
  ✓ Local Storage
  ✓ Session Storage (origins-based)

It does NOT save DOM, tabs, or UI state.
Only authentication-related browser storage.

WHAT GETS SAVED (Real Example):
--------------------------------------------------------------------------------
{
  "cookies": [
    {
      "name": "session_id",
      "value": "abc123",
      "domain": ".example.com"
    }
  ],
  "origins": [
    {
      "origin": "https://example.com",
      "localStorage": [
        { "name": "token", "value": "jwt-token-value" }
      ]
    }
  ]
}

This is literally your logged-in identity bottled into JSON.

HOW IT WORKS INTERNALLY:
--------------------------------------------------------------------------------
When you log in:
  Username + Password → Server validates → Server sends cookie/token → Browser stores it

Next requests automatically include that cookie/token.

Playwright simply exports those stored credentials.
No magic. Just smart persistence.

TYPICAL WORKFLOW (Industry Standard):
--------------------------------------------------------------------------------
Step 1 — Login once (Run this only once):
await page.context().storageState({ path: 'auth.json' });

Step 2 — Reuse login everywhere:
test.use({ storageState: 'auth.json' });
  Browser opens already authenticated.
  No login steps executed.

IMPORTANT SUBTLE DETAIL:
--------------------------------------------------------------------------------
Storage state is tied to:
  • domain
  • cookie scope
  • same-origin policy

If your app redirects to another domain (SSO like Microsoft login), storage must
include those domains too. Otherwise authentication appears "lost".

COMMON MISUNDERSTANDING:
--------------------------------------------------------------------------------
People think this saves session like a snapshot.
It doesn't.

It saves credentials, not the browser state.

So:
  open tabs ❌
  scroll position ❌
  UI elements ❌
  login tokens ✅


