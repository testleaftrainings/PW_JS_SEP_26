PART 5: CUSTOM ANNOTATIONS
================================================================================

Metadata shown in reports.

SYNTAX:
test(
    'Create Lead',
    {
        annotation: {
            type: 'issue',
            description: 'JIRA-101'
        }
    },
    async () => { }
