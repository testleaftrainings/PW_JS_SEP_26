3. REST (JSON + HTTP/1.1)     → 🏃 Medium
4. SOAP (XML + HTTP/1.1)      → 🐢 Slowest


================================================================================
                    7. SECURITY COMPARISON
================================================================================

SOAP:
--------------------------------------------------------------------------------
Security: Built-in (WS-Security)

Features:
  • Built-in WS-Security standard
  • XML Encryption
  • XML Digital Signature
  • SAML support
  • ACID compliance
  • Enterprise-grade security

REST:
--------------------------------------------------------------------------------
Security: Add-on (HTTPS + OAuth/JWT)

Features:
  • HTTPS for encryption
  • OAuth2 / OIDC for authorization
  • JWT (JSON Web Tokens)
  • API Keys
  • Basic Auth
  • Security depends on implementation

GraphQL:
--------------------------------------------------------------------------------
Security: Add-on (same as REST)

Features:
  • HTTPS
  • JWT / OAuth2
  • Query depth limiting (to prevent DoS)
  • Query cost analysis
  • Field-level authorization
  • Rate limiting

gRPC:
--------------------------------------------------------------------------------
Security: Built-in + Add-on

Features:
  • TLS/SSL encryption (gRPC over HTTP/2)
  • mTLS (mutual TLS)
  • Token-based auth (OAuth2)
  • Built-in security features
  • JWT support
  • API Key support

SECURITY COMPARISON:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Aspect              │ SOAP        │ REST        │ GraphQL    │ gRPC        │
├─────────────────────┼─────────────┼─────────────┼────────────┼─────────────┤
│ Built-in Security   │ Yes (WS-    │ No          │ No         │ Partial     │
│                     │ Security)   │             │            │             │
│ Encryption          │ XML-Enc     │ HTTPS       │ HTTPS      │ TLS         │
│ Authentication      │ WS-Security │ JWT/OAuth2  │ JWT/OAuth2 │ OAuth2, mTLS│
│ Message Integrity   │ XML-Sig     │ HTTPS       │ HTTPS      │ TLS         │
│ Best for            │ Enterprise  │ General     │ Frontend   │ Micro-      │
│                     │             │             │ apps       │ services    │
└─────────────────────┴─────────────┴─────────────┴────────────┴─────────────┘


================================================================================
                    8. STREAMING SUPPORT
================================================================================

SOAP:
--------------------------------------------------------------------------------
Streaming: MTOM for large attachments

Description:
  • MTOM (Message Transmission Optimization Mechanism)
  • SOAP with Attachments
  • Not native streaming

REST:
--------------------------------------------------------------------------------
Streaming: Server-Sent Events (SSE), WebSockets, Chunked Transfer

Description:
  • SSE (EventSource) → Server → Client
  • WebSockets → Bidirectional
  • Chunked transfer for large files
  • Not native streaming

GraphQL:
--------------------------------------------------------------------------------
Streaming: Subscriptions (via WebSockets)

Description:
  • Real-time data updates
  • Subscriptions via WebSocket
  • Live queries
  • Facebook Relay modern
  • Good support for real-time features

gRPC:
--------------------------------------------------------------------------------
Streaming: Native streaming (4 types)

Description:
  • Unary → Simple request-response
  • Server Streaming → Server sends multiple responses
  • Client Streaming → Client sends multiple requests
  • Bidirectional Streaming → Both send/receive simultaneously
  • Built on HTTP/2 multiplexing
  • Best streaming support among all

STREAMING COMPARISON:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Feature              │ SOAP     │ REST      │ GraphQL   │ gRPC            │
├──────────────────────┼──────────┼───────────┼───────────┼─────────────────┤
│ Server Streaming     │ Limited  │ SSE       │ Yes       │ Yes             │
│ Client Streaming     │ Limited  │ No        │ No        │ Yes             │
│ Bidirectional        │ Limited  │ WebSockets│ WebSockets│ Yes             │
│ Native Support       │ No       │ No        │ Yes       │ Yes             │
│ HTTP/2 Support       │ No       │ Partial   │ Partial   │ Yes             │
└──────────────────────┴──────────┴───────────┴───────────┴─────────────────┘


================================================================================
                    9. BROWSER SUPPORT
================================================================================

SOAP:
--------------------------------------------------------------------------------
Support: Limited

Characteristics:
  • Requires SOAP client libraries
  • XML parsing overhead
  • Not natively supported
  • CORS issues possible
  • Rarely used in modern frontend

REST:
--------------------------------------------------------------------------------
Support: Excellent

Characteristics:
  • Native browser support (fetch, XMLHttpRequest)
  • JSON parsing built-in
  • CORS support
  • Simple to consume
  • Most common browser API style

GraphQL:
--------------------------------------------------------------------------------
Support: Excellent

Characteristics:
  • Browser support via fetch/HTTP
  • Apollo Client, Relay, etc.
  • WebSocket support for subscriptions
  • CORS support
  • Growing adoption in frontend

gRPC:
--------------------------------------------------------------------------------
Support: Limited (gRPC-Web)

Characteristics:
  • Needs gRPC-Web library
  • No native browser support
  • gRPC-Web acts as proxy
  • Envoy proxy required sometimes
  • Limited browser support

BROWSER SUPPORT ORDER:
--------------------------------------------------------------------------------
1. REST     → ✅ Best support
2. GraphQL  → ✅ Excellent support (with libraries)
3. SOAP     → ⚠️ Limited support
4. gRPC     → ❌ Poor native support


