================================================================================
                    WHY ASYNCHRONOUS PROGRAMMING?
================================================================================s

Asynchronous programming is a programming technique where long-running
operations are executed without blocking the main execution thread. The program
can continue performing other tasks while waiting for the operation to complete,
improving responsiveness and performance.


================================================================================
                    WHAT IS A PROMISE?
================================================================================

A Promise is a JavaScript object that represents the future result of an
asynchronous operation.

Think of it this way:

Current Status:  "I have started the work."
Future Status:   "I will either complete it successfully or fail."

A Promise is JavaScript's way of saying:
  "I don't have the result right now. I'll give it to you later."

PROMISE STATES:
--------------------------------------------------------------------------------
A Promise can be in only one of three states:

1. PENDING:
  Work is still running.
  Examples: Downloading file..., Calling API..., Loading webpage...

2. FULFILLED (RESOLVED):
  Work completed successfully.
  Examples: API response received, File downloaded, Page loaded.

3. REJECTED:
  Work failed.
  Examples: Network error, Server error, File not found.


================================================================================
                    WHAT IS async?
================================================================================

async is a keyword used to declare an asynchronous function.

An async function always returns a Promise, regardless of what value you return.

Which Functions Can Be Async?
  1) Function Declaration
  2) Function Expression
  3) Arrow Function

Note: Playwright page methods are typically async.


================================================================================
                    WHAT IS await?
================================================================================

await is used to pause the execution of an async function until a Promise is
resolved or rejected.

Without await, JavaScript continues execution immediately.
With await, JavaScript waits for the result before moving to the next line.

WHY DO WE NEED ASYNC/AWAIT?
--------------------------------------------------------------------------------
Consider the following operations:
  • API calls
  • Database calls
  • File reading
  • Browser automation (Playwright)
  • Network requests

These operations take time to complete. Instead of blocking the entire
application, JavaScript performs them asynchronously.

Async/Await provides a cleaner way to handle such operations compared to .then()
chains.

WHICH FUNCTIONS CAN USE await?
--------------------------------------------------------------------------------
Rule: await can only be used inside:
  1) Async Functions
  2) Top-level modules (modern JavaScript environments)


================================================================================
              WHAT REALLY HAPPENS WHEN YOU WRITE: await page.click('#login')
================================================================================

Let's take a real Playwright line:

await page.click('#login');

STEP-BY-STEP BREAKDOWN:
--------------------------------------------------------------------------------

STEP 1: Playwright returns a Promise
  page.click() immediately returns a Promise.

STEP 2: await sees a Promise
  await tells JavaScript:
    "Pause this function here and continue after this Promise finishes."

  IMPORTANT:
    ✓ Only the current function pauses
    ✓ The JS engine keeps running other work (event loop continues)
    ✓ Other tests, timers, or callbacks can still execute

STEP 3: Callback is registered (hidden from you)
  Internally:
  page.click().then(() => {
    // resume test execution here
  });

STEP 4: Browser action happens
  Playwright:
    • Sends command to browser via WebSocket
    • Waits for action + auto-waits (visibility, stability, etc.)
    • This happens OUTSIDE the JS call stack

  Playwright's auto-waiting ensures:
    ✓ Element is attached to DOM
    ✓ Element is visible
    ✓ Element is stable (not moving)
    ✓ Element is clickable (not covered)

STEP 5: Promise is fulfilled
  Once the click completes:
    • Promise status changes from Pending → Fulfilled
    • Resume callback is placed in Microtask Queue

STEP 6: Event loop resumes your test
  When call stack is empty:
    • Microtask queue is processed
    • Your test function continues
    • console.log('After click'); executes

KEY INSIGHTS (INTERVIEW READY):
--------------------------------------------------------------------------------
1. await does NOT block the entire JavaScript engine
   • Only the current async function pauses
   • Other code (other tests, timers) can still run
   • This is NOT like Thread.sleep() in Java

2. Playwright's auto-waiting happens OUTSIDE the JS call stack
   • Visibility checks, stability checks happen in browser
   • JS engine is free to do other work
   • This is why Playwright tests are efficient

3. Promise callbacks go to Microtask Queue (higher priority)
   • Microtask Queue is processed BEFORE Task Queue
   • Higher priority than setTimeout callbacks

4. Playwright actions are NOT synchronous
   • Without await, test would continue immediately
   • Click may not have happened yet
   • This would cause flaky tests

COMMON INTERVIEW QUESTIONS:
--------------------------------------------------------------------------------
Q: What happens if I remove await?
A: Without await, the test continues immediately without waiting for the click
   to complete. This leads to race conditions and flaky tests.

   await page.click('#login');  // ✓ Waits for click
   page.click('#login');         // ✗ Continues immediately

Q: Is await same as Thread.sleep()?
A: NO. Thread.sleep() blocks the entire thread. await only pauses the current
   async function while allowing other JavaScript code to run.

Q: How does Playwright know when to resume?
A: Through the Promise's then() callback. When the browser action completes,
   the Promise resolves and the callback is added to Microtask Queue.
   The event loop then executes it when call stack is empty.

Q: Why doesn't Playwright need explicit waitForElementVisible()?
A: Playwright's auto-waiting is built into every action. Before clicking,
   it automatically waits for:
   • Element to be attached
   • Element to be visible
   • Element to be stable
   • Element to be clickable


================================================================================
                    IN-PROCESS vs OUT-OF-PROCESS AUTOMATION
================================================================================

1. IN-PROCESS AUTOMATION:
--------------------------------------------------------------------------------
What it is: Automation code runs inside the browser process. Test code and
application code share the same runtime.

Example:
Application → Browser Process → Cypress Test Code

Why we need it: Direct access to DOM, Fast communication.

Problem it solves: Eliminates external driver communication.

Tool Example: Cypress

2. OUT-OF-PROCESS AUTOMATION:
--------------------------------------------------------------------------------
What it is: Test code runs outside the browser. Commands are sent to the
browser through an external layer.

Example:
Test Script → WebDriver → Browser Driver → Browser

Why we need it: Process isolation, Browser independence.

Problem it solves: Standardized browser automation.

Tool Example: Selenium

WHERE DOES PLAYWRIGHT FIT?
--------------------------------------------------------------------------------
Playwright is Neither Pure In-Process Nor Pure Out-of-Process

Architecture:
Playwright Test (Node.js Process) → Playwright API → WebSocket/CDP/Browser
Protocol → Browser Process → Renderer Process

Notice:
  • Test code runs outside the browser ✅
  • No WebDriver/ChromeDriver ❌
  • Direct browser protocol communication ✅

Why People Call Playwright "Hybrid":
  From Out-of-Process:
    • Process Isolation
    • Separate Test Runtime
    • Better Stability (Like Selenium)

  From In-Process:
    • Fast Communication
    • Real-time Events
    • Network Interception
    • Tracing
    • Auto Waiting (Like Cypress)


================================================================================
                    W3C vs WEBSOCKET
================================================================================

W3C (Stateless API):
  A stateless API does not store client information between requests.
  Example: Selenium (HTTP Request per command)

WebSocket (Stateful API):
  A stateful API remembers information about the client between requests.
  Example: Playwright (Persistent WebSocket connection)

Playwright (WebSocket):
Test Script → Playwright → WebSocket Connection (Always Open) → Browser


================================================================================
                    BROWSER ARCHITECTURE & PLAYWRIGHT
================================================================================

WHY PLAYWRIGHT IS FAST?
--------------------------------------------------------------------------------

TRADITIONAL SELENIUM ARCHITECTURE:
Test Script → WebDriver API → Browser Driver → Browser

PROBLEM:
  • Multiple communication layers
  • Every command becomes an HTTP request
  • More latency

PLAYWRIGHT ARCHITECTURE:
Test Script → Playwright → Browser Native Protocol (WebSocket/CDP) → Browser Internals

BENEFIT:
  • Faster execution
  • Real-time communication
  • Direct access to browser components


BROWSER COMPONENTS AND PLAYWRIGHT MAPPING:
--------------------------------------------------------------------------------

1. RENDER PROCESS:
  Responsible for: Rendering HTML/CSS, Executing JavaScript, Managing DOM
  Related Playwright: DOM, CSS Selectors, Locator, getByText()

2. BROWSER PROCESS:
  Responsible for: Permissions, Security, Geolocation, User Input
  Related Playwright: Mouse Actions, Keyboard Actions, Permissions

3. NETWORK PROCESS:
  Responsible for: HTTP Requests/Responses, WebSockets
  Related Playwright: page.goto(), API Testing, route()

4. SERVICE WORKER PROCESS:
  Responsible for: Caching, Offline Mode, Push Notifications
  Related Playwright: Offline Testing, PWA Validation

ONE-LINE TAKEAWAY:
  "Every Playwright action ultimately interacts with one of four browser
  components: Render Process, Browser Process, Network Process, or Service
  Worker Process."


================================================================================
                    PLAYWRIGHT CONFIGURATION & COMMANDS
================================================================================

CONFIGURATION FILE EXPLANATION:
--------------------------------------------------------------------------------
STEP 1: Set headless: false
  export default defineConfig({
    use: { headless: false }
  });
  Why: Helps visualize test execution during development

STEP 2: Comment Firefox and WebKit projects
  projects: [
    { name: 'chromium', use: { ... } },
    // { name: 'firefox', use: { ... } },
    // { name: 'webkit', use: { ... } },
  ];
  Why: Faster execution during development (run only Chromium)

STEP 3: Set workers: 1
  export default defineConfig({
    workers: 1
  });
  Why: Easier debugging (no parallel execution conflicts)


COMMONLY USED COMMANDS:
--------------------------------------------------------------------------------
npx playwright test                      Run all tests
npx playwright test filename.spec.ts     Run specific test file
npx playwright test --grep "login"       Run tests matching pattern
npx playwright test --project=chromium   Run tests on specific browser
npx playwright test --headed             Run with UI visible
npx playwright test --debug              Run in debug mode
npx playwright show-report               Open test report in browser
npx playwright codegen                   Open test recorder

DEFAULT MODE: headless = true (runs without UI by default)


