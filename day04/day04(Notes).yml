================================================================================
                    CSS SELECTORS IN PLAYWRIGHT
================================================================================

WHAT IS A CSS SELECTOR?
================================================================================

CSS Selectors are patterns used to locate HTML elements based on:

  • Tag Name
  • ID
  • Class
  • Attribute
  • Attribute Value
  • Partial Attribute Value

In Playwright:

  await page.locator('css-selector');

Example:
  await page.locator('#username');


UNDERSTANDING THE BUILDING BLOCKS
================================================================================

Consider the element:

<input id="username"
       class="input-field"
       name="userName"
       type="text"
       placeholder="Enter Username">

┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Value                                             │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ Tag Name                │ input                                             │
│ ID Attribute            │ id                                                │
│ ID Value                │ username                                          │
│ Class Attribute         │ class                                             │
│ Class Value             │ input-field                                       │
│ Name Attribute          │ name                                              │
│ Name Value              │ userName                                          │
│ Type Attribute          │ type                                              │
│ Type Value              │ text                                              │
└─────────────────────────┴───────────────────────────────────────────────────┘


================================================================================
                    1. ID SELECTOR (#)
================================================================================

SYNTAX:
--------------------------------------------------------------------------------
  #attributeValue
  OR
  tagName#attributeValue

BREAKDOWN - input#username:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ #                       │ Represents ID                                    │
│ username                │ ID Value                                         │
└─────────────────────────┴───────────────────────────────────────────────────┘

HTML:
  <input id="username">

PLAYWRIGHT:
  await page.locator('#username');
  await page.locator('input#username');


================================================================================
                    2. CLASS SELECTOR (.)
================================================================================

SYNTAX:
--------------------------------------------------------------------------------
  .classValue
  OR
  tagName.classValue

BREAKDOWN - button.btn-primary:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ button                  │ Tag Name                                         │
│ .                       │ Represents Class                                 │
│ btn-primary             │ Class Value                                      │
└─────────────────────────┴───────────────────────────────────────────────────┘

HTML:
  <button class="btn-primary">

PLAYWRIGHT:
  await page.locator('.btn-primary');
  await page.locator('button.btn-primary');


================================================================================
                    3. ATTRIBUTE SELECTOR ([])
================================================================================

SYNTAX:
--------------------------------------------------------------------------------
  tagName[attribute='value']

BREAKDOWN - input[name='username']:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ name                    │ Attribute Name                                   │
│ username                │ Attribute Value                                  │
└─────────────────────────┴───────────────────────────────────────────────────┘

HTML:
  <input name="username">

PLAYWRIGHT:
  await page.locator("input[name='username']");


================================================================================
                    4. COMBINING MULTIPLE ATTRIBUTES
================================================================================

When one attribute is not enough to uniquely identify an element.

SYNTAX:
--------------------------------------------------------------------------------
  tagName[attribute1='value1'][attribute2='value2']

EXAMPLE - input[name='username'][type='text']:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ name                    │ Attribute 1                                      │
│ username                │ Attribute 1 Value                                │
│ type                    │ Attribute 2                                      │
│ text                    │ Attribute 2 Value                                │
└─────────────────────────┴───────────────────────────────────────────────────┘

PLAYWRIGHT:
  await page.locator("input[name='username'][type='text']");


================================================================================
                    COMBINING ID AND ATTRIBUTE
================================================================================

SYNTAX:
--------------------------------------------------------------------------------
  tagName#idValue[attribute='value']

EXAMPLE - a#crmLink[href='/crmsfa/control/main']:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ a                       │ Tag Name                                         │
│ #crmLink                │ ID Value                                         │
│ href                    │ Attribute                                        │
│ /crmsfa/control/main    │ Attribute Value                                  │
└─────────────────────────┴───────────────────────────────────────────────────┘

PLAYWRIGHT:
  await page.locator("a#crmLink[href='/crmsfa/control/main']");


================================================================================
                    5. SUBSTRING MATCHING
================================================================================

Used when values are dynamic.

Example:
  <input id="user_12345">

Tomorrow:
  <input id="user_67890">

Exact ID matching will fail.

A) STARTS WITH (^=)
--------------------------------------------------------------------------------
SYNTAX:
  tagName[attribute^='prefix']

EXAMPLE - input[id^='user_']:
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ id                      │ Attribute                                        │
│ ^=                      │ Starts With                                      │
│ user_                   │ Prefix                                           │
└─────────────────────────┴───────────────────────────────────────────────────┘

Matches:
  <input id="user_12345">
  <input id="user_56789">

PLAYWRIGHT:
  await page.locator("input[id^='user_']");


B) ENDS WITH ($=)
--------------------------------------------------------------------------------
SYNTAX:
  tagName[attribute$='suffix']

EXAMPLE - input[id$='12345']:
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ id                      │ Attribute                                        │
│ $=                      │ Ends With                                        │
│ 12345                   │ Suffix                                           │
└─────────────────────────┴───────────────────────────────────────────────────┘

Matches:
  <input id="user_12345">

PLAYWRIGHT:
  await page.locator("input[id$='12345']");


C) CONTAINS (*=)
--------------------------------------------------------------------------------
SYNTAX:
  tagName[attribute*='substring']

EXAMPLE - input[id*='user']:
┌─────────────────────────────────────────────────────────────────────────────┐
│ Part                    │ Meaning                                          │
├─────────────────────────┼───────────────────────────────────────────────────┤
│ input                   │ Tag Name                                         │
│ id                      │ Attribute                                        │
│ *=                      │ Contains                                         │
│ user                    │ Substring                                        │
└─────────────────────────┴───────────────────────────────────────────────────┘

Matches:
  <input id="user_12345">
  <input id="admin_user">

PLAYWRIGHT:
  await page.locator("input[id*='user']");


