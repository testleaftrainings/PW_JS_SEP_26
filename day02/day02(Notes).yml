7. CONDITIONAL STATEMENTS - IF STATEMENT
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used to evaluate logical conditions (true / false).

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Evaluates condition expression
  • Executes block only if condition is true
  • Supports relational and logical operators
  • Multiple conditions supported
  • Executes top-to-bottom

FALSY VALUES IN JAVASCRIPT (Only 8 values are falsy):
--------------------------------------------------------------------------------
  false
  0
  -0
  0n (BigInt zero)
  "" (empty string)
  null
  undefined
  NaN

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Can evaluate complex expressions
  • Best suited for range-based conditions
  • Uses >, <, >=, <=, &&, ||
  • Stops after first true condition
  • Flexible and dynamic

USE CASES:
--------------------------------------------------------------------------------
  • Marks grading system
  • Age validation
  • Tax slab calculation
  • Form validation logic


================================================================================
8. SWITCH STATEMENT
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used for exact value matching.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Evaluates expression once
  • Compares using strict equality (===)
  • Matches only exact values
  • Executes matching case block
  • Requires break to stop fall-through

SYNTAX:
switch (expression) {
   case value1:
      // executes if expression === value1
      break;
   case value2:
      break;
   default:
      // executes if no match
}


================================================================================
9. ITERATION STATEMENTS - FOR LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used when the number of iterations is known or count-controlled.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Executes in three parts: initialization → condition → increment/decrement
  • Condition is checked before each iteration
  • Stops when condition becomes false
  • Suitable for counter-based repetition

SYNTAX:
for (initialization; condition; increment) {
   // repeated block
}

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Initialization runs once
  2. Condition checked
  3. Block executes if true
  4. Increment runs
  5. Condition rechecked

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Best for fixed iteration count
  • Loop variable usually declared inside
  • Clear and compact structure
  • Risk of infinite loop if condition never becomes false

USE CASES:
--------------------------------------------------------------------------------
  • Iterating arrays
  • Number-based loops
  • Index-controlled logic


================================================================================
10. WHILE LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used when number of iterations is unknown and depends on condition.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Condition checked first
  • Executes only if condition is true
  • May execute zero times

SYNTAX:
while (condition) {
   // repeated block
}

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Condition checked
  2. If true → block executes
  3. After execution → condition rechecked

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Entry-controlled loop
  • Best for dynamic conditions
  • Must manually control increment inside block
  • High risk of infinite loop if update missing

USE CASES:
--------------------------------------------------------------------------------
  • Waiting for user input
  • Polling mechanism
  • Conditional repetition


================================================================================
11. DO...WHILE LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Executes block at least once, regardless of condition.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Block executes first
  • Condition checked after execution
  • Continues if condition is true

SYNTAX:
do {
   // repeated block
} while (condition);

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Block executes
  2. Condition checked
  3. If true → repeat

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Exit-controlled loop
  • Guaranteed minimum one execution
  • Useful for validation scenarios

USE CASES:
--------------------------------------------------------------------------------
  • Menu-driven programs
  • Input validation
  • Retry mechanisms
