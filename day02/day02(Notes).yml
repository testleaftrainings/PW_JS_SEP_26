                    INTERVIEW QUESTIONS & ANSWERS
================================================================================


Q1: What is the difference between var, let, and const?
--------------------------------------------------------------------------------
ANSWER:
  var: Function-scoped, can be redeclared, hoisted, available since ES5
  let: Block-scoped, cannot be redeclared, TDZ, introduced in ES6
  const: Block-scoped, cannot be reassigned or redeclared, must be initialized

Q2: What is Temporal Dead Zone (TDZ)?
--------------------------------------------------------------------------------
ANSWER:
  TDZ is the time between entering a block and the actual declaration of a
  variable using let or const. Accessing the variable during TDZ throws a
  ReferenceError.

Q3: What is hoisting in JavaScript?
--------------------------------------------------------------------------------
ANSWER:
  Hoisting is JavaScript's default behavior of moving declarations to the top
  of their scope during compilation. var declarations are hoisted, but let
  and const are not.

Q4: Why should we use let instead of var?
--------------------------------------------------------------------------------
ANSWER:
  let provides block scope, prevents accidental redeclaration, avoids hoisting
  confusion, and makes code more predictable and maintainable.

Q5: What are falsy values in JavaScript?
--------------------------------------------------------------------------------
ANSWER:
  The 8 falsy values are: false, 0, -0, 0n (BigInt zero), "" (empty string),
  null, undefined, NaN.

Q6: What is the difference between == and ===?
--------------------------------------------------------------------------------
ANSWER:
  == (Abstract Equality): Compares values after type coercion.
  === (Strict Equality): Compares values and types without coercion.

Q7: What is the difference between for, while, and do...while loops?
--------------------------------------------------------------------------------
ANSWER:
  for: Used when iteration count is known.
  while: Entry-controlled, condition checked before execution.
  do...while: Exit-controlled, executes at least once.

Q8: What is the difference between slice() and substring()?
--------------------------------------------------------------------------------
ANSWER:
  slice(): Accepts negative indices, end index excluded.
  substring(): Treats negative values as 0, end index excluded.

Q9: What is the difference between String Literal and String Object?
--------------------------------------------------------------------------------
ANSWER:
  Literal: let str = "Hello" → Creates primitive string (recommended).
  Object: let str = new String("Hello") → Creates String object (avoid).

Q10: What is the purpose of break in switch statement?
--------------------------------------------------------------------------------
ANSWER:
  break prevents fall-through behavior. Without break, execution continues to
  the next case regardless of matching.

