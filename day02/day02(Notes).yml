==================================================
4) indexOf() – Behaviour Notes
==================================================

Definition

Returns first occurrence position.

Structure

string.indexOf(value)

Example

let str="Playwright"

str.indexOf("g")

Output

4

If not found

Returns -1

==================================================
5) lastIndexOf() – Behaviour Notes
==================================================

Definition

Returns last occurrence position.

Example

let str="banana"

str.lastIndexOf("a")

Output

