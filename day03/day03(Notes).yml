ARRAY – Core Behaviour Notes
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Array is a special object used to store multiple values in a single variable.
Values are stored using index positions.
Index starts from 0.

WHY DO WE USE ARRAY?
--------------------------------------------------------------------------------
  • To store a collection of related data
  • Avoid creating multiple variables for similar data
  • Makes looping and data manipulation easier

SYNTAX:
--------------------------------------------------------------------------------
let Course = ["Selenium", "Cypress", "Playwright"];

INDEX REPRESENTATION:
--------------------------------------------------------------------------------
Course[0]  // Selenium
Course[1]  // Cypress
Course[2]  // Playwright

COMMON ARRAY OPERATIONS:
--------------------------------------------------------------------------------
Add Element:
  Course.push("Appium");      // Add at end
  Course.unshift("QTP");      // Add at beginning

Remove Element:
  Course.pop();               // Remove from end
  Course.shift();             // Remove from beginning

Find Length:
  console.log(Course.length);

Access Element:
  console.log(Course[1]);

Loop Through Array:
  for(let cour of Course) {
      console.log(cour);
  }

For Playwright interviews, focus especially on:
  forEach(), map(), filter(), find(), some(), every(), reduce(), sort(), and
  splice(). These are the ones most commonly used in framework development and
  API response handling.


================================================================================
                    ARRAY HELPER FUNCTIONS
================================================================================

1) push() – Add element at end
--------------------------------------------------------------------------------
let arr = [1, 2];
arr.push(3);
console.log(arr);  // Output: [1, 2, 3]

2) pop() – Remove element from end
--------------------------------------------------------------------------------
let arr = [1, 2, 3];
arr.pop();
console.log(arr);  // Output: [1, 2]

3) unshift() – Add element at beginning
--------------------------------------------------------------------------------
let arr = [2, 3];
arr.unshift(1);
console.log(arr);  // Output: [1, 2, 3]

4) shift() – Remove element from beginning
--------------------------------------------------------------------------------
let arr = [1, 2, 3];
arr.shift();
console.log(arr);  // Output: [2, 3]

5) splice() – Add/Remove elements
--------------------------------------------------------------------------------
let arr = [10, 20, 30, 40];
arr.splice(2, 1);
console.log(arr);  // Output: [10, 20, 40]

6) slice() – Extract portion of array
--------------------------------------------------------------------------------
let arr = [10, 20, 30, 40];
console.log(arr.slice(1, 3));  // Output: [20, 30]

7) indexOf() – Find index of value
--------------------------------------------------------------------------------
let arr = ["Chrome", "Edge", "Firefox"];
console.log(arr.indexOf("Edge"));  // Output: 1

8) includes() – Check value exists
--------------------------------------------------------------------------------
let arr = ["Chrome", "Edge", "Firefox"];
console.log(arr.includes("Chrome"));  // Output: true

9) sort() – Sort array
--------------------------------------------------------------------------------
let arr = [100, 2, 30];
arr.sort((a, b) => a - b);
console.log(arr);  // Output: [2, 30, 100]

10) reverse() – Reverse array
--------------------------------------------------------------------------------
let arr = [1, 2, 3];
console.log(arr.reverse());  // Output: [3, 2, 1]

11) forEach() – Iterate array
--------------------------------------------------------------------------------
let arr = ["Chrome", "Edge"];
arr.forEach(browser => {
    console.log(browser);
});
// Output: Chrome, Edge

12) map() – Transform each element
--------------------------------------------------------------------------------
let arr = [1, 2, 3];
let result = arr.map(num => num * 2);
console.log(result);  // Output: [2, 4, 6]

13) filter() – Filter elements
--------------------------------------------------------------------------------
let arr = [10, 20, 30, 40];
let result = arr.filter(num => num > 20);
console.log(result);  // Output: [30, 40]

14) find() – Return first matching element
--------------------------------------------------------------------------------
let arr = [10, 20, 30, 40];
let result = arr.find(num => num > 20);
console.log(result);  // Output: 30

15) findIndex() – Return index of first match
--------------------------------------------------------------------------------
let arr = [10, 20, 30, 40];
let result = arr.findIndex(num => num > 20);
console.log(result);  // Output: 2

16) some() – At least one match
--------------------------------------------------------------------------------
let arr = [10, 20, 30];
console.log(arr.some(num => num > 25));  // Output: true

17) every() – All elements match
--------------------------------------------------------------------------------
let arr = [10, 20, 30];
console.log(arr.every(num => num > 5));  // Output: true

18) reduce() – Accumulate values
--------------------------------------------------------------------------------
let arr = [10, 20, 30];
let total = arr.reduce((sum, num) => sum + num, 0);
console.log(total);  // Output: 60

19) join() – Convert array to string
--------------------------------------------------------------------------------
let arr = ["Chrome", "Edge", "Firefox"];
console.log(arr.join(", "));  // Output: Chrome, Edge, Firefox

20) concat() – Merge arrays
--------------------------------------------------------------------------------
let arr1 = [1, 2];
let arr2 = [3, 4];
console.log(arr1.concat(arr2));  // Output: [1, 2, 3, 4]

QUICK INTERVIEW REVISION:
--------------------------------------------------------------------------------
push()       -> Add at end
pop()        -> Remove from end
unshift()    -> Add at start
shift()      -> Remove from start
splice()     -> Add/Remove elements
slice()      -> Extract portion
indexOf()    -> Find index
includes()   -> Check existence
sort()       -> Sort array
reverse()    -> Reverse array
forEach()    -> Iterate
map()        -> Transform data
filter()     -> Filter data
find()       -> First matching element
findIndex()  -> First matching index
some()       -> At least one match
every()      -> All match
reduce()     -> Accumulate values
join()       -> Array to string
concat()     -> Merge arrays


================================================================================
                    STRING – CORE BEHAVIOUR NOTES
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A String is an immutable sequence of characters.

KEY BEHAVIOUR:
--------------------------------------------------------------------------------
  • Strings are primitive data types
  • Strings are immutable
  • String methods return a new string
  • Index starts from 0

EXAMPLE:
--------------------------------------------------------------------------------
"Playwright"
P = index 0
t = index 9


================================================================================
                    STRING CREATION – BEHAVIOUR NOTES
================================================================================

JavaScript provides 2 common ways to create a String:
  1) Literal Way
  2) Instantiation (Constructor) Way

1) LITERAL WAY:
--------------------------------------------------------------------------------
Creates a string directly using quotes.

let str = "Playwright"
let trainer = "Bhuvanesh"
console.log(trainer)  // Output: Bhuvanesh

Execution Behaviour:
  • Creates a primitive string
  • Lightweight
  • Faster
  • Most commonly used
  • Recommended approach

Type Check:
let str = "Playwright"
console.log(typeof str)  // Output: string

2) INSTANTIATION WAY:
--------------------------------------------------------------------------------
Creates a string object using the String constructor.

let str = new String("Playwright")
let trainer = new String("Bhuvanesh")
console.log(trainer)  // Output: [String: 'Bhuvanesh']

Execution Behaviour:
  • Creates a String Object
  • Uses constructor
  • Occupies more memory
  • Rarely used in real projects

Type Check:
let str = new String("Playwright")
console.log(typeof str)  // Output: object

REAL-TIME RECOMMENDATION:
--------------------------------------------------------------------------------
Always use: let str = "Playwright"
Avoid: let str = new String("Playwright")

95%+ of Playwright, Selenium, Node.js, and TypeScript projects use String
Literals.


================================================================================
                    STRING HELPER FUNCTIONS
================================================================================

1) slice() – Extract portion
--------------------------------------------------------------------------------
let str = "Playwright"
str.slice(0, 4)  // Output: "Play"
• End index excluded
• Supports negative index

2) substring() – Extract portion
--------------------------------------------------------------------------------
let str = "Playwright"
str.substring(0, 4)  // Output: "Play"
• End index excluded
• Negative values treated as 0

Difference from slice(): slice(-3) works; substring(-3) treats -3 as 0

3) charAt() – Returns character at position
--------------------------------------------------------------------------------
let str = "Playwright"
str.charAt(0)  // Output: "P"

4) indexOf() – Find first occurrence position
--------------------------------------------------------------------------------
let str = "Playwright"
str.indexOf("g")  // Output: 4
If not found: Returns -1

5) lastIndexOf() – Find last occurrence position
--------------------------------------------------------------------------------
let str = "banana"
str.lastIndexOf("a")  // Output: 5

6) includes() – Check if text exists
--------------------------------------------------------------------------------
let str = "Playwright"
str.includes("wright")  // Output: true

7) startsWith() – Check beginning of string
--------------------------------------------------------------------------------
let str = "Playwright"
str.startsWith("Play")  // Output: true

8) endsWith() – Check ending of string
--------------------------------------------------------------------------------
let str = "Playwright"
str.endsWith("wright")  // Output: true

9) replace() – Replaces first matching value
--------------------------------------------------------------------------------
let str = "I like Java"
str.replace("Java", "TypeScript")  // Output: "I like TypeScript"

10) replaceAll() – Replaces all matching values
--------------------------------------------------------------------------------
let str = "Java Java Java"
str.replaceAll("Java", "TS")  // Output: "TS TS TS"

11) split() – Converts string to array
--------------------------------------------------------------------------------
let str = "Chrome,Edge,Firefox"
str.split(",")  // Output: ["Chrome", "Edge", "Firefox"]

12) trim() – Removes spaces from beginning and end
--------------------------------------------------------------------------------
let str = "   Playwright   "
str.trim()  // Output: "Playwright"

13) toUpperCase() – Converts to uppercase
--------------------------------------------------------------------------------
"playwright".toUpperCase()  // Output: "PLAYWRIGHT"

14) toLowerCase() – Converts to lowercase
--------------------------------------------------------------------------------
"PLAYWRIGHT".toLowerCase()  // Output: "playwright"

15) concat() – Combines multiple strings
--------------------------------------------------------------------------------
let first = "Play"
let second = "wright"
first.concat(second)  // Output: "Playwright"

16) repeat() – Repeats string N times
--------------------------------------------------------------------------------
"Hi".repeat(3)  // Output: "HiHiHi"

17) match() – Used with Regular Expressions
--------------------------------------------------------------------------------
let str = "Testleaf123"
str.match(/[0-9]+/)  // Output: ["123"]

18) search() – Searches using Regular Expression
--------------------------------------------------------------------------------
let str = "Playwright123"
str.search(/[0-9]/)  // Output: 10

19) padStart() – Adds characters at beginning
--------------------------------------------------------------------------------
"5".padStart(3, "0")  // Output: "005"

20) padEnd() – Adds characters at end
--------------------------------------------------------------------------------
"5".padEnd(3, "0")  // Output: "500"


================================================================================
                    FUNCTIONS – CORE BEHAVIOUR NOTES
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A Function is a reusable block of code that performs a specific task when
invoked (called).

WHY FUNCTIONS?
--------------------------------------------------------------------------------
  • Avoid code duplication
  • Improve reusability
  • Improve maintainability
  • Follow DRY Principle (Don't Repeat Yourself)

SYNTAX:
function functionName() {
    // code
}


================================================================================
                    1) FUNCTION DECLARATION
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A named function created using the function keyword.

EXAMPLE:
function greet() {
    console.log("Hello")
}
greet()  // Output: Hello

EXECUTION BEHAVIOUR:
  • Hoisted completely
  • Can be called before declaration
  • Most common traditional approach


================================================================================
                    2) FUNCTION EXPRESSION
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A function stored inside a variable.

EXAMPLE:
let greet = function() {
    console.log("Hello")
}
greet()  // Output: Hello

EXECUTION BEHAVIOUR:
  • Not fully hoisted
  • Variable is hoisted, function is not
  • Called only after declaration


================================================================================
                    3) ANONYMOUS FUNCTION
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A function without a name.

EXAMPLE:
function() {
    console.log("Hello")
}

Usually used inside:
  • Callbacks
  • Event handlers
  • Function expressions


================================================================================
                    4) IIFE (Immediately Invoked Function Expression)
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Function executes immediately after creation.

EXAMPLE:
(function() {
    console.log("Executed")
})()  // Output: Executed

EXECUTION BEHAVIOUR:
  • Runs immediately
  • No explicit call needed
  • Creates private scope


================================================================================
                    5) ARROW FUNCTION
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Short-hand syntax introduced in ES6.

EXAMPLE:
let greet = () => {
    console.log("Hello")
}
greet()  // Output: Hello

EXECUTION BEHAVIOUR:
  • Short syntax
  • No own this
  • Widely used in Playwright
  • Common in map(), filter(), find()


================================================================================
                    6) CALLBACK FUNCTION
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A function passed as an argument to another function.

EXAMPLE:
function greet(name) {
    console.log(name)
}

function execute(callback) {
    callback("Bhuvanesh")
}

execute(greet)  // Output: Bhuvanesh

EXECUTION BEHAVIOUR:
  • Used heavily in JavaScript
  • Used in async operations
  • Used in Array helpers

WHY CALLBACK EXISTS?
--------------------------------------------------------------------------------
Because JavaScript often doesn't know WHEN something will finish.

Examples:
  • API Call
  • Database Call
  • File Download
  • User Click
  • Timer
  • Browser Event

Since timing is unknown, JavaScript says:
  "Give me a function. I'll call it when work is finished."


================================================================================
                    7) HIGHER ORDER FUNCTION (HOF)
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
A function that:
  • Accepts another function OR
  • Returns another function

EXAMPLE:
function execute(callback) {
    callback()
}

HOF Examples:
  forEach()
  map()
  filter()
  find()
  reduce()

Example:
let nums = [1, 2, 3]
nums.forEach(num => console.log(num))


================================================================================
                    ASYNC / AWAIT & PROMISES
================================================================================

WHAT IS async?
--------------------------------------------------------------------------------
async is a keyword used to declare an asynchronous function.

An async function always returns a Promise, regardless of what value you return.

Which Functions Can Be Async?
  1) Function Declaration
  2) Function Expression
  3) Arrow Function

Note: Playwright page methods are typically async.

WHAT IS await?
--------------------------------------------------------------------------------
await is used to pause the execution of an async function until a Promise is
resolved or rejected.

Without await, JavaScript continues execution immediately.
With await, JavaScript waits for the result before moving to the next line.

WHY DO WE NEED ASYNC/AWAIT?
--------------------------------------------------------------------------------
Consider the following operations:
  • API calls
  • Database calls
  • File reading
  • Browser automation (Playwright)
  • Network requests

These operations take time to complete. Instead of blocking the entire
application, JavaScript performs them asynchronously.

Async/Await provides a cleaner way to handle such operations compared to
.then() chains.

WHICH FUNCTIONS CAN USE await?
--------------------------------------------------------------------------------
Rule: await can only be used inside:
  1) Async Functions
  2) Top-level modules (modern JavaScript environments)


================================================================================
                    WHAT IS A PROMISE?
================================================================================

A Promise is a JavaScript object that represents the future result of an
asynchronous operation.

Think of it this way:
  Current Status: "I have started the work."
  Future Status: "I will either complete it successfully or fail."

A Promise is JavaScript's way of saying:
  "I don't have the result right now. I'll give it to you later."

PROMISE STATES:
--------------------------------------------------------------------------------
A Promise can be in only one of three states:

1. PENDING:
  Work is still running.
  Examples: Downloading file..., Calling API..., Loading webpage...

2. FULFILLED (RESOLVED):
  Work completed successfully.
  Examples: API response received, File downloaded, Page loaded.

3. REJECTED:
  Work failed.
  Examples: Network error, Server error, File not found.

